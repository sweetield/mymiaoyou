name = "mymiaoyou"
main = "worker/src/index.ts"

# 打包配置
minify = true
compatibility_flags = [ "nodejs_compat" ]
compatibility_date = "2025-03-01"
keep_vars = true

# 启用 D1 数据库
[[d1_databases]]
binding = "DB"
database_name = "miaoyou"
database_id = "5aac1923-1484-4857-b13c-b4e7c4eac984"

# 设置域名
[vars]
VITE_EMAIL_DOMAIN = "bridgeman.eu.org,granitebit.eu.org,newgames.eu.org,gmails.dpdns.org,gmailsoutlook.dpdns.org,haoowij.eu.cc,iusdwew.eu.cc,longtimes.dpdns.org,memoryd.dpdns.org,oiwjlslksq.eu.cc,outlooks.dpdns.org"
VITE_EXTERNAL_LINKS = "临时Gmail邮箱|https://smailpro.com/temporary-email,真实地址生成器|https://ip.alice7.eu.org/"
# VITE_EXTERNAL_LINKS 也可以在 Cloudflare Dashboard → Workers → 环境变量中覆盖
# 格式：标签|URL,标签|URL（最多5个）

# 配置邮件处理
[triggers]
crons = ["0 * * * *"]

[build]
command = "pnpm run build"

[assets]
binding = "ASSETS"
directory = "frontend/dist"
not_found_handling = "single-page-application"

[ai]
binding = "AI"

[observability]
enabled = false
head_sampling_rate = 1
